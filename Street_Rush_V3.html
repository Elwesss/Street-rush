<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Street Rush V3</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0e;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;color:#fff;text-shadow:0 2px 5px #000;pointer-events:none}
#brand{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;font-weight:800;font-size:15px}
#stats{font-size:12px;font-weight:500;margin-top:3px}
#speed{position:absolute;right:15px;bottom:108px;font-size:38px;font-weight:800}
#rpm{position:absolute;right:17px;bottom:92px;font-size:12px}
#money{position:absolute;top:max(13px,env(safe-area-inset-top));right:15px;font-weight:800}
#controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 13px;pointer-events:none}
.group{display:flex;gap:9px}
button{pointer-events:auto;border:1px solid #fff4;background:#10151bcc;color:#fff;border-radius:15px;width:66px;height:56px;font-size:24px;-webkit-tap-highlight-color:transparent}
#topbuttons{position:fixed;top:max(48px,calc(env(safe-area-inset-top) + 30px));left:14px;display:flex;gap:7px;pointer-events:auto}
.top{width:auto;height:38px;padding:0 11px;font-size:12px}
#garage{display:none;position:fixed;inset:0;background:#0b0d11ee;color:white;padding:25px 15px;overflow:auto;z-index:5}
h1{margin:10px 0 3px;font-size:27px}.sub{opacity:.7;font-size:13px;margin-bottom:15px}
.card{background:#151a20;border:1px solid #ffffff1c;border-radius:16px;padding:14px;margin:10px 0}
.carname{font-size:20px;font-weight:800}.price{opacity:.75;margin:5px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.action{width:auto;height:40px;padding:0 13px;font-size:13px}
.bar{height:7px;background:#333;border-radius:10px;overflow:hidden;margin:5px 0 9px}.bar i{display:block;height:100%;background:#ddd}
#closeGarage{position:fixed;right:15px;top:15px;width:45px;height:40px;font-size:20px}
#toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:#111d;color:#fff;padding:14px 18px;border-radius:14px;opacity:0;transition:.2s;z-index:9;text-align:center}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="brand">STREET RUSH · V3<div id="stats">0 m · Course libre</div></div>
 <div id="money">💰 2 500 €</div>
 <div id="speed">0 km/h</div><div id="rpm">RPM 800</div>
</div>
<div id="topbuttons">
 <button class="top" id="garageBtn">GARAGE</button><button class="top" id="weatherBtn">☀️ JOUR</button><button class="top" id="cameraBtn">CAMÉRA</button>
</div>
<div id="controls">
 <div class="group"><button data-k="left">◀</button><button data-k="right">▶</button></div>
 <div class="group"><button data-k="brake">▼</button><button data-k="gas">▲</button></div>
</div>
<div id="toast"></div>
<section id="garage">
 <button id="closeGarage">✕</button>
 <h1>Garage</h1><div class="sub">Achète une voiture et améliore ses performances.</div>
 <div id="cars"></div>
</section>
<script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d',{alpha:false});
let W,H,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize,{passive:true});resize();
const keys={left:false,right:false,gas:false,brake:false};
document.querySelectorAll('[data-k]').forEach(b=>{
 const q=b.dataset.k;
 const down=e=>{e.preventDefault();keys[q]=true;b.setPointerCapture?.(e.pointerId)};
 const up=e=>{e.preventDefault();keys[q]=false};
 b.addEventListener('pointerdown',down,{passive:false});b.addEventListener('pointerup',up,{passive:false});b.addEventListener('pointercancel',up,{passive:false});
});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key==='ArrowUp')keys.gas=true;if(e.key==='ArrowDown')keys.brake=true;if(e.key.toLowerCase()==='r')reset()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.key==='ArrowUp')keys.gas=false;if(e.key==='ArrowDown')keys.brake=false});
const carsData=[
 {name:'Street GT',price:0,top:190,acc:43,grip:1,level:1,owned:true,desc:'Coupé sportif'},
 {name:'Euro RS',price:8500,top:225,acc:48,grip:1.05,level:1,owned:false,desc:'Sportive européenne'},
 {name:'Super V12',price:28000,top:285,acc:55,grip:1.1,level:1,owned:false,desc:'Supercar'},
];
let save=JSON.parse(localStorage.getItem('streetRushV3')||'null')||{money:2500,selected:0,cars:carsData.map(x=>({...x}))};
function persist(){localStorage.setItem('streetRushV3',JSON.stringify(save))}
let camera=0,wet=false,night=false,car,traffic,dist,last=performance.now(),world=0;
function reset(){car={x:0,speed:0,steer:0,health:100};traffic=Array.from({length:9},(_,i)=>({x:(Math.random()-.5)*1.55,z:120+i*105,v:40+Math.random()*55}));dist=0;world=0}
reset();

function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.opacity=0,1400)}
function current(){return save.cars[save.selected]}
function renderGarage(){
 const box=document.getElementById('cars');box.innerHTML='';
 save.cars.forEach((x,i)=>{
   const d=document.createElement('div');d.className='card';
   const max=x.top+(x.level-1)*10, acc=x.acc+(x.level-1)*2;
   d.innerHTML=`<div class="carname">${x.name} ${i===save.selected?'✓':''}</div><div class="price">${x.desc} · ${x.price?x.price.toLocaleString('fr-FR')+' €':'Déjà disponible'}</div>
   <div>Vitesse max · ${max} km/h</div><div class="bar"><i style="width:${Math.min(100,max/3)}%"></i></div>
   <div>Accélération · ${acc}</div><div class="bar"><i style="width:${Math.min(100,acc*1.5)}%"></i></div>
   <div class="row">
   ${x.owned?`<button class="action" data-select="${i}">Choisir</button><button class="action" data-up="${i}">Turbo +10 · ${1200*x.level} €</button>`:`<button class="action" data-buy="${i}">Acheter · ${x.price.toLocaleString('fr-FR')} €</button>`}
   </div>`;
   box.appendChild(d);
 });
 box.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{save.selected=+b.dataset.select;persist();renderGarage();reset();toast('Voiture sélectionnée')});
 box.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.buy,x=save.cars[i];if(save.money>=x.price){save.money-=x.price;x.owned=true;save.selected=i;persist();renderGarage();reset();toast(x.name+' achetée !')}else toast('Pas assez d’argent')});
 box.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let i=+b.dataset.up,x=save.cars[i],cost=1200*x.level;if(save.money>=cost){save.money-=cost;x.level++;persist();renderGarage();toast('Amélioration installée')}else toast('Pas assez d’argent')});
 document.getElementById('money').textContent='💰 '+save.money.toLocaleString('fr-FR')+' €';
}
document.getElementById('garageBtn').onclick=()=>{renderGarage();document.getElementById('garage').style.display='block'};
document.getElementById('closeGarage').onclick=()=>document.getElementById('garage').style.display='none';
document.getElementById('weatherBtn').onclick=()=>{wet=!wet;night=wet;document.getElementById('weatherBtn').textContent=wet?'🌧️ PLUIE':'☀️ JOUR'};
document.getElementById('cameraBtn').onclick=()=>camera=(camera+1)%2;

let audio=null,osc=null,gain=null;
function engineStart(){
 if(audio)return;
 try{
  audio=new (window.AudioContext||window.webkitAudioContext)();
  osc=audio.createOscillator();gain=audio.createGain();osc.type='sawtooth';osc.frequency.value=70;gain.gain.value=.025;osc.connect(gain).connect(audio.destination);osc.start();
 }catch(e){}
}
function engineSound(){if(osc){osc.frequency.value=55+current().top*0.28+car.speed*1.7;gain.gain.value=.012+car.speed/10000}}
document.body.addEventListener('pointerdown',engineStart,{once:true});

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function curve(z){return Math.sin((z+world)*.004)*.20+Math.sin((z+world)*.0017)*.14}
function proj(z){let s=H/(z+40);return {y:H*.43+s*40,s}}
function road(){
 let horizon=H*.43;
 ctx.fillStyle=night?'#101b2c':'#88bada';ctx.fillRect(0,0,W,horizon);
 ctx.fillStyle=wet?'#3d5d46':'#79a764';ctx.fillRect(0,horizon,W,H-horizon);
 ctx.fillStyle=night?'#28364b':'#5e716b';ctx.beginPath();ctx.moveTo(0,horizon);
 for(let x=0;x<=W;x+=25)ctx.lineTo(x,horizon-35-Math.sin(x*.011)*35);ctx.lineTo(W,horizon);ctx.fill();
 for(let z=950;z>10;z-=8){
  let a=proj(z),b=proj(z+8),cc=W/2+curve(z)*W*.43,dd=W/2+curve(z+8)*W*.43,r=165*a.s,r2=165*b.s;
  ctx.fillStyle=wet?'#292d31':'#3e3e3e';ctx.beginPath();ctx.moveTo(cc-r,a.y);ctx.lineTo(cc+r,a.y);ctx.lineTo(dd+r2,b.y);ctx.lineTo(dd-r2,b.y);ctx.fill();
  ctx.strokeStyle='#e5e5e5';ctx.lineWidth=Math.max(1,3*a.s);ctx.beginPath();ctx.moveTo(cc-r*.92,a.y);ctx.lineTo(dd-r2*.92,b.y);ctx.stroke();ctx.beginPath();ctx.moveTo(cc+r*.92,a.y);ctx.lineTo(dd+r2*.92,b.y);ctx.stroke();
  if((z|0)%50<25){ctx.strokeStyle='#eee69b';ctx.lineWidth=Math.max(1,2*a.s);ctx.beginPath();ctx.moveTo(cc,a.y);ctx.lineTo(dd,b.y);ctx.stroke()}
 }
 if(wet){ctx.strokeStyle='#fff4';ctx.lineWidth=1;for(let i=0;i<70;i++){let x=(i*113+world*2)%W,y=(i*67+world*3)%(H*.78);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+14);ctx.stroke()}}
}
function drawTraffic(){
 for(const t of traffic.slice().sort((a,b)=>b.z-a.z)){if(t.z<7||t.z>1000)continue;let p=proj(t.z),m=W/2+curve(t.z)*W*.43,x=m+t.x*120*p.s,w=34*p.s,h=55*p.s;
  ctx.fillStyle='#aeb7bd';ctx.fillRect(x-w/2,p.y-h,w,h);ctx.fillStyle='#182126';ctx.fillRect(x-w*.4,p.y-h*.82,w*.8,h*.22);ctx.fillStyle=night?'#ff5555':'#c93636';ctx.fillRect(x-w*.43,p.y-h*.12,w*.18,h*.08);ctx.fillRect(x+w*.25,p.y-h*.12,w*.18,h*.08);
 }
}
function player(){
 let x=W/2+car.x*120,y=camera?H*.84:H*.78;ctx.save();ctx.translate(x,y);ctx.rotate(car.steer*.1);
 if(!camera){ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,18,40,13,0,0,Math.PI*2);ctx.fill();let g=ctx.createLinearGradient(-25,-55,25,20);g.addColorStop(0,'#e8edf0');g.addColorStop(.5,'#52616b');g.addColorStop(1,'#172126');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-23,-55,46,72,9);ctx.fill();ctx.fillStyle='#17242a';ctx.beginPath();ctx.roundRect(-16,-44,32,22,6);ctx.fill();ctx.fillStyle='#a8bbc3';ctx.fillRect(-12,-40,24,9);ctx.fillStyle='#f4efbd';ctx.fillRect(-18,9,8,4);ctx.fillRect(10,9,8,4)}
 else{ctx.fillStyle='#171c20';ctx.beginPath();ctx.moveTo(-W*.5,30);ctx.lineTo(-W*.19,-58);ctx.lineTo(W*.19,-58);ctx.lineTo(W*.5,30);ctx.fill();ctx.fillStyle='#8da7b255';ctx.beginPath();ctx.moveTo(-W*.18,-54);ctx.lineTo(W*.18,-54);ctx.lineTo(W*.25,-3);ctx.lineTo(-W*.25,-3);ctx.fill();ctx.fillStyle='#20272b';ctx.fillRect(-W*.5,5,W,55)}
 ctx.restore();
}
function frame(now){
 let dt=Math.min(.04,(now-last)/1000);last=now,x=current();
 if(keys.gas)car.speed+=x.acc*(1+(x.level-1)*.025)*dt;else car.speed-=7*dt;if(keys.brake)car.speed-=82*dt;
 car.speed=clamp(car.speed,0,x.top+(x.level-1)*10);
 let s=(keys.left?-1:0)+(keys.right?1:0),grip=wet?.70*x.grip:x.grip;
 car.steer+=(s-car.steer)*Math.min(1,dt*9);car.x+=car.steer*(.55+car.speed/250)*dt*grip;car.x=clamp(car.x,-1.22,1.22);
 if(Math.abs(car.x)>1.02)car.speed=Math.max(0,car.speed-28*dt);
 dist+=car.speed*dt/3.6;world+=car.speed*dt*1.2;
 for(const t of traffic){t.z-=(car.speed-t.v)*dt;if(t.z<4){t.z=850+Math.random()*350;t.x=(Math.random()-.5)*1.6;t.v=45+Math.random()*50}if(t.z<42&&t.z>6&&Math.abs(t.x-car.x)<.27){car.speed*=.90;car.health=clamp(car.health-15*dt,0,100)}}
 road();drawTraffic();player();engineSound();
 document.getElementById('speed').textContent=Math.round(car.speed)+' km/h';
 document.getElementById('rpm').textContent='RPM '+Math.round(800+car.speed*38);
 document.getElementById('stats').textContent=Math.floor(dist)+' m · '+x.name+' · Intégrité '+Math.round(car.health)+'%';
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
