<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Street Rush Mobile</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;text-shadow:0 2px 4px #000;pointer-events:none}
#title{position:absolute;top:max(14px,env(safe-area-inset-top));left:15px;font-size:15px;font-weight:700}
#distance{font-size:12px;font-weight:400;margin-top:3px}
#speed{position:absolute;right:16px;bottom:108px;font-size:38px;font-weight:800}
#gear{position:absolute;right:20px;bottom:92px;font-size:13px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;text-align:center;opacity:0}
#controls{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
.group{display:flex;gap:9px}
button{pointer-events:auto;width:68px;height:58px;border:1px solid #fff5;background:#111b;color:#fff;border-radius:16px;font-size:25px;-webkit-tap-highlight-color:transparent}
.small{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;width:auto;height:38px;padding:0 12px;font-size:13px;border-radius:12px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="title">STREET RUSH · MOBILE<div id="distance">0 m · Intégrité 100%</div></div>
 <button class="small" id="cam">CAMÉRA</button>
 <div id="gear">D</div>
 <div id="speed">0 km/h</div>
 <div id="msg"></div>
</div>
<div id="controls">
 <div class="group">
  <button data-key="left">◀</button><button data-key="right">▶</button>
 </div>
 <div class="group">
  <button data-key="brake">▼</button><button data-key="gas">▲</button>
 </div>
</div>
<script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d',{alpha:false});
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize,{passive:true});resize();

const k={left:false,right:false,gas:false,brake:false};
document.querySelectorAll('[data-key]').forEach(b=>{
 const key=b.dataset.key;
 const down=e=>{e.preventDefault();k[key]=true;b.setPointerCapture?.(e.pointerId)};
 const up=e=>{e.preventDefault();k[key]=false};
 b.addEventListener('pointerdown',down,{passive:false});
 b.addEventListener('pointerup',up,{passive:false});
 b.addEventListener('pointercancel',up,{passive:false});
});
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')k.left=true;
 if(e.key==='ArrowRight')k.right=true;
 if(e.key==='ArrowUp')k.gas=true;
 if(e.key==='ArrowDown')k.brake=true;
 if(e.key.toLowerCase()==='r')reset();
});
addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft')k.left=false;
 if(e.key==='ArrowRight')k.right=false;
 if(e.key==='ArrowUp')k.gas=false;
 if(e.key==='ArrowDown')k.brake=false;
});
let camera=0,wet=false,night=false,car,traffic,dist,last=performance.now(),world=0;
function reset(){
 car={x:0,speed:0,steer:0,health:100};
 traffic=Array.from({length:8},(_,i)=>({x:(Math.random()-.5)*1.5,z:130+i*110,v:45+Math.random()*45}));
 dist=0;world=0;
}
reset();

document.getElementById('cam').onclick=()=>camera=(camera+1)%2;

function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function curve(z){return Math.sin((z+world)*.004)*.20+Math.sin((z+world)*.0017)*.14}
function proj(z){let s=H/(z+40);return {y:H*.43+s*40,s}}
function road(){
 const horizon=H*.43;
 ctx.fillStyle=night?'#111c2d':'#88bada';ctx.fillRect(0,0,W,horizon);
 ctx.fillStyle=night?'#304333':'#79a764';ctx.fillRect(0,horizon,W,H-horizon);
 ctx.fillStyle=night?'#27354a':'#5e716b';
 ctx.beginPath();ctx.moveTo(0,horizon);
 for(let x=0;x<=W;x+=25)ctx.lineTo(x,horizon-35-Math.sin(x*.011)*35);
 ctx.lineTo(W,horizon);ctx.fill();
 for(let z=950;z>10;z-=8){
   let a=proj(z),b=proj(z+8),cc=W/2+curve(z)*W*.43,dd=W/2+curve(z+8)*W*.43;
   let rw=165*a.s,rw2=165*b.s;
   ctx.fillStyle=wet?'#292d31':'#3e3e3e';
   ctx.beginPath();ctx.moveTo(cc-rw,a.y);ctx.lineTo(cc+rw,a.y);ctx.lineTo(dd+rw2,b.y);ctx.lineTo(dd-rw2,b.y);ctx.fill();
   ctx.strokeStyle='#e1e1e1';ctx.lineWidth=Math.max(1,3*a.s);
   ctx.beginPath();ctx.moveTo(cc-rw*.92,a.y);ctx.lineTo(dd-rw2*.92,b.y);ctx.stroke();
   ctx.beginPath();ctx.moveTo(cc+rw*.92,a.y);ctx.lineTo(dd+rw2*.92,b.y);ctx.stroke();
   if((z|0)%50<25){ctx.strokeStyle='#f1e99b';ctx.lineWidth=Math.max(1,2*a.s);ctx.beginPath();ctx.moveTo(cc,a.y);ctx.lineTo(dd,b.y);ctx.stroke()}
 }
 if(night){
   let g=ctx.createRadialGradient(W/2,H*.78,5,W/2,H*.78,H*.65);
   g.addColorStop(0,'#fff4');g.addColorStop(1,'#fff0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 }
}
function cars(){
 for(const t of traffic.slice().sort((a,b)=>b.z-a.z)){
   if(t.z<7||t.z>1000)continue;
   let p=proj(t.z),center=W/2+curve(t.z)*W*.43,x=center+t.x*120*p.s,w=34*p.s,h=55*p.s;
   ctx.fillStyle='#aeb6bc';ctx.fillRect(x-w/2,p.y-h,w,h);
   ctx.fillStyle='#182126';ctx.fillRect(x-w*.4,p.y-h*.82,w*.8,h*.22);
   ctx.fillStyle=night?'#ff5757':'#c93636';ctx.fillRect(x-w*.43,p.y-h*.12,w*.18,h*.08);ctx.fillRect(x+w*.25,p.y-h*.12,w*.18,h*.08);
 }
}
function player(){
 let x=W/2+car.x*120,y=camera?H*.84:H*.78;
 ctx.save();ctx.translate(x,y);ctx.rotate(car.steer*.1);
 if(!camera){
   ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,18,40,13,0,0,Math.PI*2);ctx.fill();
   let g=ctx.createLinearGradient(-25,-55,25,20);g.addColorStop(0,'#e8edf0');g.addColorStop(.5,'#52616b');g.addColorStop(1,'#172126');
   ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-23,-55,46,72,9);ctx.fill();
   ctx.fillStyle='#17242a';ctx.beginPath();ctx.roundRect(-16,-44,32,22,6);ctx.fill();
   ctx.fillStyle='#a8bbc3';ctx.fillRect(-12,-40,24,9);
   ctx.fillStyle='#f4efbd';ctx.fillRect(-18,9,8,4);ctx.fillRect(10,9,8,4);
 }else{
   ctx.fillStyle='#171c20';ctx.beginPath();ctx.moveTo(-W*.5,30);ctx.lineTo(-W*.19,-58);ctx.lineTo(W*.19,-58);ctx.lineTo(W*.5,30);ctx.fill();
   ctx.fillStyle='#8da7b255';ctx.beginPath();ctx.moveTo(-W*.18,-54);ctx.lineTo(W*.18,-54);ctx.lineTo(W*.25,-3);ctx.lineTo(-W*.25,-3);ctx.fill();
   ctx.fillStyle='#20272b';ctx.fillRect(-W*.5,5,W,55);
 }
 ctx.restore();
}
function frame(now){
 let dt=Math.min(.04,(now-last)/1000);last=now;
 if(k.gas)car.speed+=43*dt; else car.speed-=7*dt;
 if(k.brake)car.speed-=82*dt;
 car.speed=clamp(car.speed,0,190);
 let s=(k.left?-1:0)+(k.right?1:0),grip=wet?.70:1;
 car.steer+=(s-car.steer)*Math.min(1,dt*9);
 car.x+=car.steer*(.55+car.speed/250)*dt*grip;
 car.x=clamp(car.x,-1.22,1.22);
 if(Math.abs(car.x)>1.02)car.speed=Math.max(0,car.speed-28*dt);
 dist+=car.speed*dt/3.6;world+=car.speed*dt*1.2;
 for(const t of traffic){
   t.z-=(car.speed-t.v)*dt;
   if(t.z<4){t.z=850+Math.random()*350;t.x=(Math.random()-.5)*1.6;t.v=45+Math.random()*50}
   if(t.z<42&&t.z>6&&Math.abs(t.x-car.x)<.27){car.speed*=.90;car.health=clamp(car.health-18*dt,0,100)}
 }
 road();cars();player();
 document.getElementById('speed').textContent=Math.round(car.speed)+' km/h';
 document.getElementById('distance').textContent=Math.floor(dist)+' m · Intégrité '+Math.round(car.health)+'%';
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
